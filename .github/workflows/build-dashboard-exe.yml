name: Build Dashboard EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build CLI EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name pyworxcloud-dashboard test_dashboard.py

      - name: Build GUI EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name pyworxcloud-dashboard-gui test_dashboard_gui.py

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pyworxcloud-dashboards-windows-exe
          path: |
            dist/pyworxcloud-dashboard.exe
            dist/pyworxcloud-dashboard-gui.exe

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pyworxcloud-dashboard.exe
            dist/pyworxcloud-dashboard-gui.exe
